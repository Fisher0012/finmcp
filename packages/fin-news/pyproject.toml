[project]
name = "fin-news"
version = "0.1.0"
description = "财经新闻自采集与检索（5 源采集 + SQLite + 查询 API）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "finmcp-common>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_news"]
